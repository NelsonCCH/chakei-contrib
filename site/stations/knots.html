<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>外賣 · 結庫</title>
<!-- The knot library review page, linked from nowhere in the game: all 100 knots of the 外賣 station by tier with
     their metrics. Script: knots.js, built by scripts/build.mjs from src/stations-next/knots/page.ts. -->
<style>
:root{--wall:#235648;--paper:#fbfaf1;--ink:#1c2924;--mute:#58695f;color-scheme:light}
body{margin:0;background:#a9cbbd;color:var(--ink);font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif}
header{background:var(--wall);color:#f4efd9;padding:12px 16px}
header h1{margin:0;font-size:20px}
header p{margin:6px 0 0;font-size:13px;line-height:1.5;opacity:.9}
main{padding:8px 12px 40px;max-width:1700px;margin:0 auto}
section{margin:14px 0 22px}
h2{font-size:18px;margin:0 0 8px}
h2 small{font-size:12px;font-weight:400;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:5px;display:flex;flex-direction:column;align-items:center}
.card canvas{background:#f7f5ec;border-radius:4px}
.info{font-size:12px;line-height:1.45;width:100%;margin-top:4px;font-variant-numeric:tabular-nums}
.fam{color:var(--mute);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>外賣：綁袋結庫（100 個）</h1>
  <p>10 級，每級 10 款，由易到難。每款照一部 390 × 844 嘅手機畫：綠點係「起」，黃格係尾；卡上灰字係類別（17 類：圈圈、蚊香、星形、8字、鋸齒、波浪、套圈、花、心形、心心、龍捲風、塗鴉、草書英文、書法、線頭、魔法陣、組合）。複雜度 = 長度（÷ 綁袋位大小）+ 轉咗幾多圈 + 0.4 × 交叉次數；每級嘅複雜度都高過上一級。邊個放錯級，話我知編號（例如 3-7）。</p>
</header>
<main id="lib"></main>
<script src="knots.js"></script>
</body>
</html>
