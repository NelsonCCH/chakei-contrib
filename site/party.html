<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#235648">
<meta name="robots" content="noindex">
<title>派對模式 · 試玩</title>
<!-- Party mode's between-round screens on their own page, for a playtest outside the co-op lobby.
     A whole night against the real night state machine (src/core/party/) with up to 8 fake players on one screen; the
     rounds are a stand-in drawn from the bot calibration. party.js is built by scripts/build.mjs from
     src/ui/party/page.ts (npm run build). The screens' own look is src/ui/party/style.ts; the game's style sheet is
     linked for its colour and font tokens. The strip on top (#rig) is the playtest's controls, not game art.
     Not linked from the game. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&family=Noto+Serif+HK:wght@900&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
html,body{margin:0;height:100%}
body{position:fixed;inset:0;display:flex;flex-direction:column;background:#0f1a16;overflow:hidden}
#rig{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 4px) 6px 4px;background:#0f1a16;color:#bfe3c8;font:12px/1.3 system-ui,sans-serif}
.rrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rp{display:inline-flex;border:1px solid #3a5a4e;opacity:.55}
.rp.in{opacity:1}
.rp.view{outline:2px solid #ffd25a}
#rig button{font:inherit;color:#e6f1ec;background:#1d3a31;border:0;padding:4px 6px;cursor:pointer;max-width:9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rig .rin{background:#2f6b5a;min-width:2.2em}
#rig .rp:not(.in) .rin{background:#5a2f2f}
#rig button[aria-pressed="true"]{background:#ffd25a;color:#0f1a16}
.rseg{display:inline-flex;gap:1px}
.rinfo{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.8}
#phone{flex:1 1 0;min-height:0;position:relative}
</style>
</head>
<body>
<div id="rig"></div>
<div id="phone"></div>
<script src="party.js"></script>
</body>
</html>
